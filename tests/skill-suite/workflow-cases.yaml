version: 1

# Gates name observable decisions or evidence. Evaluations assert these outcomes, not prose.
cases:
  - id: staged-baseline-attribution
    area: results
    prompt: Review the first 10% of a pinned source range for statistical and chart baseline changes. Continue within the agreed run limit while human decisions remain pending. Preserve source master.
    expected_skills: [inet-baseline-review, inet-statistical-tests, inet-chart-tests]
    required_gates:
      - pinned-source-and-baseline-controls
      - agreed-stage-and-work-limit
      - isolated-candidates-and-preserved-master
      - retained-workspaces-and-incremental-builds
      - smallest-executable-source-cause
      - per-result-and-per-chart-differences
      - independent-correctness-basis
      - persistent-history-and-artifact-links
      - evidence-versioned-human-decisions
      - authoritative-decisions-in-attribution-records
      - separate-decisions-for-mixed-commit
      - provisional-dependent-candidates
      - checkpoint-before-further-stage

  - id: baseline-reverse-control
    area: results
    prompt: A mixed source commit changes a scalar and its chart. The forward explanation is difficult. Test a minimal reverse patch that restores the suspected defect. A later commit cancels the final numerical difference.
    expected_skills: [inet-baseline-review]
    required_gates:
      - isolated-minimal-reverse-patch
      - predicted-effect-before-execution
      - new-reverse-and-restored-controls
      - incremental-build-after-patch-application-and-removal
      - valid-old-control-when-available
      - wrong-behavior-explained-independently
      - partial-agreement-not-overclaimed
      - transient-differences-retained
      - no-source-history-amendment

  - id: baseline-reverse-without-old-control
    area: results
    prompt: The old source cannot execute. A minimal reverse patch on the new source restores a duplicate count. A trace shows the defect independently. Review the attribution without an old control.
    expected_skills: [inet-baseline-review]
    required_gates:
      - new-reverse-and-restored-controls
      - independent-evidence-for-restored-defect
      - historical-differences-unverified-when-unsupported
      - no-mandatory-old-endpoint-execution

  - id: baseline-decision-after-edit
    area: results
    prompt: A human accepts a baseline candidate. Correct a spelling error in its explanation. Later, change the candidate value. Keep the decision history accurate.
    expected_skills: [inet-baseline-review]
    required_gates:
      - editorial-correction-preserves-acceptance
      - material-change-invalidates-affected-acceptance
      - prior-decision-preserved-in-attribution-record
      - index-and-chain-derived-from-authoritative-record

  - id: baseline-rejected-dependency
    area: results
    prompt: A human rejects one candidate while later candidates depend on it. Prepare publication only to statistics and media after the review resolves the dependencies.
    expected_skills: [inet-baseline-review]
    required_gates:
      - rejection-and-evidence-preserved
      - dependent-candidates-excluded-from-accepted-chain
      - fresh-final-source-reconciliation
      - every-final-difference-attributed
      - baseline-approval-separated-from-publication
      - source-master-preserved
      - separate-repository-publication-status

  - id: current-plan-guidance
    area: planning
    prompt: Prepare a plan from the active project map. The linked plan procedure is a draft with conditional approval requirements.
    expected_skills: [inet-project-guidance]
    required_gates:
      - active-checkout-and-local-guidance-state
      - linked-procedure-and-policy-contents
      - draft-applicability-before-approval
      - verified-facts-separated-from-proposals
      - planned-checks-separated-from-executed-evidence

  - id: protocol-plan-commit-tests
    area: planning
    prompt: Prepare an implementation plan for two protocol repairs and a prerequisite refactor. Current series and test rules require protocol tests and reviewer documents. The separate plan approval process remains a draft. Do not start implementation.
    expected_skills: [inet-project-guidance, inet-pull-request-authoring, inet-regression-testing]
    required_gates:
      - current-content-rules-independent-of-draft-approval
      - individual-future-commits-and-dependencies
      - current-protocol-gap-and-evidence-per-applicable-commit
      - existing-tests-or-explicit-coverage-gap
      - explicit-protocol-test-tasks-with-paths-and-scenarios
      - expected-results-before-and-after-code-correction
      - explicit-reviewer-markdown-task-per-applicable-commit
      - reviewer-document-path-and-necessary-diagrams
      - explained-protocol-exclusions-for-refactor
      - proposed-results-separated-from-executed-evidence
      - no-implementation-during-plan-preparation

  - id: changed-project-guidance
    area: authoring
    prompt: Continue verification after local project edits move the gate procedure and change its required mode. The old procedure names a replacement.
    expected_skills: [inet-code-authoring]
    required_gates:
      - refresh-guidance-after-document-change
      - follow-explicit-replacement
      - current-command-and-mode-selection
      - recheck-affected-evidence

  - id: authoring-semantic-change
    area: authoring
    prompt: Implement a semantic INET packet-processing change and add focused coverage.
    expected_skills: [inet-code-authoring]
    required_gates:
      - seal-resolution-before-write
      - complete-pre-write-contract
      - production-path-test-mapping
      - post-write-self-audit

  - id: independent-diff-review
    area: review
    prompt: Independently review an INET C++/NED working-tree diff without editing it.
    expected_skills: [inet-code-review]
    required_gates:
      - read-only-review
      - changed-contract-inventory
      - evidence-backed-actionable-findings
      - focused-validation-assessment

  - id: multi-evidence-runtime-debug
    area: debugging
    prompt: Diagnose a Wi-Fi packet loss that may involve INI selection, MAC state, and PHY reception.
    expected_skills: [inet-agent-orchestration, inet-80211-packet-debugging]
    required_gates:
      - independent-evidence-lanes
      - smallest-reproduction
      - first-causal-divergence
      - evidence-authority-order

  - id: repeated-run-results
    area: results
    prompt: Compare repeated OMNeT++ runs and plot a confidence interval without false replication.
    expected_skills: [omnetpp-result-analysis, omnetpp-result-plotting]
    required_gates:
      - repetition-identity
      - explicit-result-filter
      - reproducible-derived-summary
      - non-interactive-artifacts

  - id: wifi-regression-design
    area: regression
    prompt: Turn a Wi-Fi retry bug into a deterministic regression that reaches the production path.
    expected_skills: [inet-regression-testing, inet-80211-regression-testing]
    required_gates:
      - behavior-claim-to-invariant
      - matching-test-category
      - minimal-deterministic-reproduction
      - production-path-evidence
      - bounded-seed-or-parameter-campaign

  - id: fixed-base-history-cleanup
    area: branch-cleanup
    prompt: Rebuild an opp_repl-tested fixed-base branch with mixed sub-hunks and temporary detours as a reviewable series with the same final tree.
    expected_skills: [inet-branch-cleanup, inet-opp-repl, inet-pull-request-authoring]
    required_gates:
      - immutable-pinned-topic
      - approved-change-groups
      - coverage-ledger
      - per-commit-opp-repl-evidence
      - final-tree-equality

  - id: simple-fixed-base-history-cleanup
    area: branch-cleanup
    prompt: Quickly squash and reword a linear, tested fixed-base branch whose commit mapping is obvious and needs no detours or baseline movement.
    expected_skills: [inet-branch-cleanup-simple, inet-opp-repl, inet-pull-request-authoring]
    required_gates:
      - immutable-pinned-topic
      - single-approved-commit-plan
      - construct-before-verification
      - sequential-per-commit-opp-repl-sweep
      - final-tree-equality
      - escalation-on-complexity

  - id: high-risk-upstream-rebase
    area: branch-rebase
    prompt: Rebase an opp_repl-tested topic with overlapping contracts through risky upstream checkpoints and preserve forensic attempts.
    expected_skills: [inet-branch-rebase, inet-opp-repl, inet-pull-request-authoring]
    required_gates:
      - immutable-pinned-inputs
      - approved-groups-and-topology
      - preserved-attempt-branches
      - tested-safe-points
      - final-control-comparison

  - id: simple-one-shot-upstream-rebase
    area: branch-rebase
    prompt: Rebase a linear tested topic once onto pinned upstream when dependency mapping proves no changed-contract overlap and no conflicts are expected.
    expected_skills: [inet-branch-rebase-simple, inet-opp-repl, inet-pull-request-authoring]
    required_gates:
      - immutable-pinned-inputs
      - no-overlap-admission-check
      - valid-pinned-main-control
      - equal-one-to-one-range-diff
      - sequential-final-commit-verification
      - final-union-verification
      - escalation-on-complexity
