name: Skill suite

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Run skill suite tests
        run: python -m unittest discover -s tests/skill-suite -p 'test_*.py' -v
      - name: Validate source suite
        run: python3 scripts/validate_skill_suite.py --root . --check
      - name: Package and validate an isolated profile
        run: |
          package_parent="$(mktemp -d)"
          python3 scripts/package_skill_suite.py \
            --root . --profile results --output "$package_parent/deployment"
          python3 scripts/validate_skill_suite.py \
            --root . --check --deployment-root "$package_parent/deployment"
