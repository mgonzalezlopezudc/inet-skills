version: 1

project_guidance:
  entrypoint: doc/project/README.md

shared_resources:
  - .agents/references/project-guidance-discovery.md

generated_metadata:
  source: .agents/skill-suite.yaml
  targets:
    - agents/openai.yaml
    - agents/antigravity.yaml

verification_results:
  schema: .agents/schemas/verification-result-v1.schema.json
  adapter: .agents/scripts/normalize_verification.py
  runners: [unit, module, fingerprint, opp_repl]
  fixtures: tests/skill-suite/fixtures/verification
  required_fixtures:
    unit:
      - unit-pass.log
      - unit-assertion-failure.log
      - zero-selection.log
      - malformed-output.log
    module:
      - module-build-error.log
    fingerprint:
      - fingerprint-expected-change.log
      - fingerprint-expected-results.log
      - fingerprint-failure.log
      - fingerprint-unexpected-pass.log
    opp_repl:
      - opp-repl-empty.log
      - opp-repl-error.log
      - opp-repl-pass.log
      - opp-repl-single-fail.log
      - opp-repl-single-pass.log

profiles:
  default:
    extends: [wifi, results, history]
    skills: []
  core:
    skills:
      - ieee-standards
      - inet-agent-orchestration
      - inet-architectural-requirements
      - inet-build-debug-modes
      - inet-cmdenv-log-analysis
      - inet-code-authoring
      - inet-code-review
      - inet-fingerprint-regression
      - inet-lldb-debugging
      - inet-ned-ini-analysis
      - inet-packet-tag-debugging
      - inet-pcap-tshark-analysis
      - inet-protocol-tests
      - inet-project-guidance
      - inet-pull-request-authoring
      - inet-regression-testing
      - inet-simulation-run
      - inet-unit-tests
      - omnetpp-eventlog-analysis
  wifi:
    extends: [core]
    skills:
      - ieee80211-standards
      - inet-80211-packet-debugging
      - inet-80211-regression-testing
  results:
    skills:
      - inet-statistical-tests
      - omnetpp-result-analysis
      - omnetpp-result-plotting
  history:
    extends: [core]
    skills:
      - inet-branch-cleanup
      - inet-branch-cleanup-simple
      - inet-branch-rebase
      - inet-branch-rebase-simple
      - inet-opp-repl
      - inet-pull-request-authoring
  walkthrough:
    extends: [wifi, results]
    skills: [inet-80211-walkthrough-writer]
    activation_requires:
      all_files:
        - examples/ieee80211/analysis/wifi_analysis.py
        - examples/ieee80211/analysis/README.md

skills:
  inet-project-guidance:
    metadata:
      display_name: INET Project Guidance
      short_description: Use current project documents for plans and contributor policy
      default_prompt: Use $inet-project-guidance to follow the active INET project map for this plan or document task. Read the applicable current documents before you select requirements, formats, checks, or approvals.
    dependencies: []
    required_tools: []
    checkout_requirements:
      required: []
      optional: []

  ieee-standards:
    metadata:
      display_name: IEEE Standards
      short_description: Navigate IEEE 802.11 and 802.15.4 standards
      default_prompt: Use $ieee-standards to retrieve the relevant IEEE text. Verify the edition, clauses, objects, definitions, and cross-references. Cite the verified material.
    dependencies: []
    required_tools: [inet_process_standards]
    checkout_requirements:
      required: []
      optional: [standards]

  ieee80211-standards:
    metadata:
      display_name: IEEE 802.11 Standards
      short_description: Navigate IEEE 802.11 structure, definitions, and references
      default_prompt: Use $ieee80211-standards to retrieve the relevant IEEE 802.11 text. Trace its cross-references. Verify the clauses, objects, and definitions. Cite the verified material.
    dependencies: [ieee-standards]
    required_tools: [inet_process_standards]
    checkout_requirements:
      required: []
      optional: [standards]

  inet-80211-packet-debugging:
    metadata:
      display_name: INET 802.11 Packet Debugging
      short_description: Debug reproducible Wi-Fi frame exchanges
      default_prompt: Use $inet-80211-packet-debugging to trace this Wi-Fi exchange. Identify the first divergence that the evidence supports.
    dependencies:
      - ieee80211-standards
      - inet-cmdenv-log-analysis
      - inet-lldb-debugging
      - inet-ned-ini-analysis
      - inet-packet-tag-debugging
      - inet-pcap-tshark-analysis
      - omnetpp-eventlog-analysis
    required_tools: [inet, tshark]
    checkout_requirements:
      required: []
      optional: [standards]

  inet-80211-regression-testing:
    metadata:
      display_name: INET 802.11 Regression Testing
      short_description: Design focused Wi-Fi regression tests
      default_prompt: Use $inet-80211-regression-testing to design a deterministic regression test for this Wi-Fi behavior.
    dependencies:
      - ieee80211-standards
      - inet-fingerprint-regression
      - inet-ned-ini-analysis
      - inet-regression-testing
      - inet-unit-tests
    required_tools: [inet]
    checkout_requirements:
      required: []
      optional: [standards]

  inet-80211-walkthrough-writer:
    metadata:
      display_name: INET 802.11 Walkthrough Writer
      short_description: Explain Wi-Fi features from generated evidence
      default_prompt: Confirm that the active checkout provides the shared analyzer. Use $inet-80211-walkthrough-writer to explain this feature from generated scalar/vector and PCAP evidence.
    dependencies: []
    required_tools: [python3]
    checkout_requirements:
      required:
      - examples/ieee80211/analysis/wifi_analysis.py
      - examples/ieee80211/analysis/README.md
      optional: []

  inet-agent-orchestration:
    metadata:
      display_name: INET Agent Orchestration
      short_description: Coordinate delegated INET specialist work
      default_prompt: Use $inet-agent-orchestration to coordinate the independent evidence tasks and specialist handoffs required by this OMNeT++/INET task.
    dependencies: []
    deployment_files: [MODELS.md, .codex, .antigravity]
    required_tools: []
    checkout_requirements:
      required: []
      optional: []

  inet-architectural-requirements:
    metadata:
      display_name: INET Architectural Requirements
      short_description: Apply INET architecture and sealing rules
      default_prompt: Use $inet-architectural-requirements to evaluate this INET change against the applicable architecture, naming, and sealing requirements.
    dependencies: []
    required_tools: [python3]
    checkout_requirements:
      required: []
      optional: []

  inet-branch-cleanup:
    metadata:
      display_name: INET Branch Cleanup
      short_description: Rebuild INET branches into reviewable commits
      default_prompt: Use $inet-branch-cleanup to rebuild this tested INET topic branch as a reviewable commit series. Preserve its final tree.
    dependencies: [inet-opp-repl, inet-pull-request-authoring]
    required_tools: [git, opp_repl]
    checkout_requirements:
      required: []
      optional: []

  inet-branch-cleanup-simple:
    metadata:
      display_name: INET Simple Branch Cleanup
      short_description: Rebuild simple INET commit series
      default_prompt: Use $inet-branch-cleanup-simple to rebuild this tested, linear INET topic branch as a reviewable commit series.
    dependencies: [inet-opp-repl, inet-pull-request-authoring]
    required_tools: [git, opp_repl]
    checkout_requirements:
      required: []
      optional: []

  inet-branch-rebase:
    metadata:
      display_name: INET Branch Rebase
      short_description: Rebase INET branches through safe checkpoints
      default_prompt: Use $inet-branch-rebase to carry this tested INET topic branch across the approved upstream checkpoints.
    dependencies:
      - inet-architectural-requirements
      - inet-code-authoring
      - inet-opp-repl
      - inet-pull-request-authoring
    required_tools: [git, opp_repl]
    checkout_requirements:
      required: []
      optional: []

  inet-branch-rebase-simple:
    metadata:
      display_name: INET Simple Branch Rebase
      short_description: Quickly verify a one-shot INET branch rebase
      default_prompt: Use $inet-branch-rebase-simple to replay this tested, linear INET topic once onto pinned upstream. Verify every resulting commit.
    dependencies: [inet-opp-repl, inet-pull-request-authoring]
    routes_to: [inet-branch-rebase]
    required_tools: [git, opp_repl]
    checkout_requirements:
      required: []
      optional: []

  inet-build-debug-modes:
    metadata:
      display_name: INET Debug Builds
      short_description: Build or diagnose INET debug artifacts
      default_prompt: Use $inet-build-debug-modes to build or diagnose the matching INET debug artifacts for this task.
    dependencies: []
    required_tools: [make]
    checkout_requirements:
      required: [Makefile]
      optional: []

  inet-cmdenv-log-analysis:
    metadata:
      display_name: INET Cmdenv Log Analysis
      short_description: Find behavior and events in Cmdenv logs
      default_prompt: Use $inet-cmdenv-log-analysis to extract the relevant module decisions, warnings, drops, and event context from this Cmdenv log.
    dependencies: []
    required_tools: [rg]
    checkout_requirements:
      required: []
      optional: []

  inet-code-authoring:
    metadata:
      display_name: INET Code Authoring
      short_description: Prevent defects in INET changes
      default_prompt: Use $inet-code-authoring to define the contract for this INET change. Implement the validated contract. Check the result against that contract.
    dependencies: [inet-code-review]
    required_tools: [git, rg]
    checkout_requirements:
      required: []
      optional: []

  inet-code-review:
    metadata:
      display_name: INET Code Review
      short_description: Layered C++, OMNeT++, INET, and Wi-Fi review
      default_prompt: Use $inet-code-review for an independent review of the current INET diff. Report actionable findings with evidence.
    dependencies: []
    required_tools: [git, rg]
    checkout_requirements:
      required: []
      optional: []

  inet-fingerprint-regression:
    metadata:
      display_name: INET Fingerprint Regression
      short_description: Diagnose fingerprint regressions
      default_prompt: Use $inet-fingerprint-regression to diagnose this fingerprint change. Determine whether the change is expected.
    dependencies: []
    required_tools: [python3]
    checkout_requirements:
      required: [tests/fingerprint/fingerprinttest]
      optional: []

  inet-lldb-debugging:
    metadata:
      display_name: INET LLDB Debugging
      short_description: Debug INET simulations at C++ source level
      default_prompt: Use $inet-lldb-debugging to reproduce this INET runtime failure. Inspect the relevant C++ state.
    dependencies: [inet-build-debug-modes, inet-simulation-run]
    required_tools: [lldb]
    checkout_requirements:
      required: [Makefile]
      optional: []

  inet-ned-ini-analysis:
    metadata:
      display_name: INET NED/INI Analysis
      short_description: Trace effective NED and INI configuration
      default_prompt: Use $inet-ned-ini-analysis to resolve the effective NED types, INI inheritance, and parameter values for this configuration.
    dependencies: []
    required_tools: [rg]
    checkout_requirements:
      required: []
      optional: []

  inet-opp-repl:
    metadata:
      display_name: INET opp_repl Verification
      short_description: Run scoped opp_repl verification
      default_prompt: Use $inet-opp-repl to discover the active interface. Map the directly related scope. Normalize this verification run.
    dependencies: []
    routes_to:
      - inet-fingerprint-regression
      - omnetpp-result-analysis
      - omnetpp-result-plotting
    required_tools: [opp_repl]
    checkout_requirements:
      required: [tests/dependency.json]
      optional: []

  inet-packet-tag-debugging:
    metadata:
      display_name: INET Packet and Tag Debugging
      short_description: Trace INET packet, chunk, and tag behavior
      default_prompt: Use $inet-packet-tag-debugging to find where this packet, chunk, or tag state first changes incorrectly.
    dependencies: []
    required_tools: [rg]
    checkout_requirements:
      required: []
      optional: []

  inet-pcap-tshark-analysis:
    metadata:
      display_name: INET PCAP/TShark Analysis
      short_description: Analyze INET packet captures
      default_prompt: Use $inet-pcap-tshark-analysis to record or inspect this INET packet exchange. Correlate the relevant capture points.
    dependencies: [inet-cmdenv-log-analysis]
    required_tools: [capinfos, tshark]
    checkout_requirements:
      required: []
      optional: []

  inet-protocol-tests:
    metadata:
      display_name: INET Protocol Tests
      short_description: Run focused INET protocol suites
      default_prompt: Use $inet-protocol-tests to run the selected protocol tests with a matching INET build. Diagnose any unexpected outcomes.
    dependencies: []
    required_tools: [inet_run_protocol_tests, opp_test, opp_makemake, make]
    checkout_requirements:
      required: [tests/protocol, python/inet/test/opp.py, python/inet/test/all.py]
      optional: []

  inet-pull-request-authoring:
    metadata:
      display_name: INET Pull Request Authoring
      short_description: Prepare reviewable commits and pull requests
      default_prompt: Use $inet-pull-request-authoring to plan or audit the commit series and pull request for this INET change.
    dependencies: []
    required_tools: [git]
    checkout_requirements:
      required: []
      optional: []

  inet-regression-testing:
    metadata:
      display_name: INET Regression Testing
      short_description: Design protocol-neutral INET regressions
      default_prompt: Use $inet-regression-testing to turn this behavior claim into a minimal deterministic regression with direct evidence.
    dependencies:
      - inet-fingerprint-regression
      - inet-simulation-run
      - inet-unit-tests
    routes_to:
      - inet-cmdenv-log-analysis
      - inet-lldb-debugging
      - inet-ned-ini-analysis
      - inet-packet-tag-debugging
      - inet-pcap-tshark-analysis
      - omnetpp-eventlog-analysis
      - omnetpp-result-analysis
      - omnetpp-result-plotting
    required_tools: []
    checkout_requirements:
      required: []
      optional: []

  inet-simulation-run:
    metadata:
      display_name: INET Simulation Runner
      short_description: Run reproducible INET simulations
      default_prompt: Use $inet-simulation-run to run this simulation reproducibly. Diagnose any initialization or runtime failure.
    dependencies: [inet-build-debug-modes]
    required_tools: [inet]
    checkout_requirements:
      required: [Makefile]
      optional: []

  inet-statistical-tests:
    metadata:
      display_name: INET Statistical Tests
      short_description: Check INET statistical regression results
      default_prompt: Use $inet-statistical-tests to run the relevant result comparisons. Diagnose failures against the matching baseline revision.
    dependencies: []
    required_tools: [inet_run_statistical_tests, make, opp_scavetool]
    checkout_requirements:
      required: [python/inet/test/statistical.py]
      optional: [statistics]

  inet-unit-tests:
    metadata:
      display_name: INET Unit Tests
      short_description: Run focused INET unit and module tests
      default_prompt: Use $inet-unit-tests to build the required debug artifacts. Run the focused INET unit or module tests for this change.
    dependencies: [inet-build-debug-modes]
    required_tools: [inet_run_module_tests, inet_run_unit_tests, make]
    checkout_requirements:
      required: [tests/unit, tests/module]
      optional: []

  omnetpp-eventlog-analysis:
    metadata:
      display_name: OMNeT++ Event Log Analysis
      short_description: Trace OMNeT++ message and event causality
      default_prompt: Use $omnetpp-eventlog-analysis to reconstruct the scheduling and message-delivery causality behind this simulation behavior.
    dependencies: [inet-cmdenv-log-analysis]
    required_tools: [rg]
    checkout_requirements:
      required: []
      optional: []

  omnetpp-result-analysis:
    metadata:
      display_name: OMNeT++ Result Analysis
      short_description: Analyze OMNeT++ simulation results
      default_prompt: Use $omnetpp-result-analysis to query the relevant scalar or vector results. Export those results for this comparison.
    dependencies: []
    required_tools: [opp_scavetool]
    checkout_requirements:
      required: []
      optional: []

  omnetpp-result-plotting:
    metadata:
      display_name: OMNeT++ Result Plotting
      short_description: Plot reproducible OMNeT++ simulation results
      default_prompt: Use $omnetpp-result-plotting to create a reproducible non-interactive plot for these simulation results. Include the derived summary.
    dependencies: [omnetpp-result-analysis]
    required_tools: [python3]
    checkout_requirements:
      required: []
      optional: []
